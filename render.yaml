services:
  # 1. Backend Spring Boot Web Service
  - type: web
    name: apex-banking-backend
    runtime: docker
    rootDir: backend
    dockerfilePath: ./Dockerfile
    plan: free
    region: oregon
    healthCheckPath: /v3/api-docs
    envVars:
      - key: PORT
        value: 10000
      - key: SPRING_DATASOURCE_URL
        value: jdbc:mysql://gateway01.ap-northeast-1.prod.aws.tidbcloud.com:4000/enterprise_bank_db?sslMode=VERIFY_IDENTITY&enabledTLSProtocols=TLSv1.2,TLSv1.3
      - key: SPRING_DATASOURCE_USERNAME
        value: HVtbf3tQkyxXK4C.root
      - key: SPRING_DATASOURCE_PASSWORD
        value: LACrrRIQSQxK1tDU

  # 2. Frontend React / Vite Static Site
  - type: web
    name: apex-banking-frontend
    runtime: static
    rootDir: frontend
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    envVars:
      - key: NODE_VERSION
        value: 20.18.0
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
