services:
  # 1. Backend Spring Boot Web Service
  - type: web
    name: apex-banking-backend
    env: docker
    dockerfilePath: backend/Dockerfile
    plan: free
    region: oregon
    healthCheckPath: /v3/api-docs
    envVars:
      - key: PORT
        value: 10000
      - key: SPRING_DATASOURCE_URL
        sync: false
      - key: SPRING_DATASOURCE_USERNAME
        sync: false
      - key: SPRING_DATASOURCE_PASSWORD
        sync: false

  # 2. Frontend React / Vite Static Site
  - type: web
    name: apex-banking-frontend
    env: static
    plan: free
    region: oregon
    buildCommand: cd frontend && npm install && npm run build
    staticPublishPath: frontend/dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
